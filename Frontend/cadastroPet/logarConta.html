<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Veterinário</title>
    <link rel="stylesheet" href="../cadastroPet/cadastroPet.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h1>LOGIN</h1>

        <form id="loginForm">
            <input type="text" id="Pet" placeholder="Nome do Pet" required>
            <input type="text" id="especie" placeholder="Espécie" required>


            <button type="submit">ENTRAR</button>
        </form>

        <p class="erro" id="erroMsg"></p>

        <p class="cadastro">
            Não possui conta? <a href="../cadastroPet/cadastroPet.html">Clique aqui!</a>
        </p>
    </div>
</div>

<script src="../cadastroPet/logarConta.js"></script>
</body>
</html>
