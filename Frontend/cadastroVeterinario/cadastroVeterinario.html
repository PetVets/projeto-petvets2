<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Veterinário</title>
    <link rel="stylesheet" href="../CadastroVeterinario/cadastroVeterinario.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h1>CADASTRO</h1>

        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Nome do Veterinário" required>
            
            <div class="linha">
                <input type="password" id="senha" placeholder="Senha" required>
                <input type="text" id="CRMV" placeholder="CRMV" required>
            </div>

            <div class="linha">
                <input type="text" id="cpf" placeholder="CPF" required>
            </div>

            <button type="submit">CADASTRAR</button>
        </form>

        <p class="erro" id="erroMsg"></p>

        <p class="cadastro">
            Já tem conta? <a href="/Frontend/CadastroVeterinario/logarConta.html">Clique aqui!</a>
        </p>
    </div>
</div>

<script src="../Js/cadastro.js"></script>
</body>
</html>
