<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Veterinário</title>
    <link rel="stylesheet" href="../CadastroVeterinario/cadastroVeterinario.css">
</head>
<body>

<div class="container">
    <div class="login-box">
        <h1>LOGIN</h1>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <input type="password" id="CRMV" placeholder="CRMV" required>


            <button type="submit">ENTRAR</button>
        </form>

        <p class="erro" id="erroMsg"></p>

        <p class="cadastro">
            Não possui conta? <a href="../CadastroVeterinario/cadastroVeterinario.html">Clique aqui!</a>
        </p>
    </div>
</div>

<script src="../Js/login.js"></script>
</body>
</html>
