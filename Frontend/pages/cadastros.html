<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/cadastros.css"> 
<title>Cadastro de Tutor - PetVets</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<header>
    <div class="logo">
        <img src="/img/mascoteNormal.png" alt="Mascote">
        PetVets
    </div>

    <a href="/index.html" class="btn-voltar">
        Voltar
    </a>
</header>

<div class="container">
    <div class="ilustracao">
        <img src="/img/mascoteTutor.webp" alt="Mascote PetVets">
    </div>
    <div class="form-box">
        <h2>Cadastro do Tutor</h2>

        <form id="formTutor">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Telefone</label>
                <input type="text" id="telefone" required>
            </div>

            <div class="input-group">
                <label>Cpf</label>
                <input type="text" id="cpf" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="text" id="senha" required>
            </div>

            <button type="submit" id="btnCadastrar">
                Salvar Cadastro
            </button>

            <button type="button" id="btnAnimal" disabled>
                Cadastrar Animal
            </button>

        </form>
    </div>
</div>

<footer>
© 2026 PetVets • Todos os direitos reservados.
</footer>

<script src="/js/cadastros.js"></script> 
</body>
</html>
