<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cadastroPet.css"> 
    <title>Cadastro do Pet - PetVets</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <img src="/img/mascoteNormal.png" alt="Mascote">
            PetVets
        </div>
        <a href="/index.html" class="btn-voltar">
            Voltar
        </a>
    </header>

    <div class="container">
        <div class="ilustracao">
            <img src="/img/mascoteDoente.png" alt="Mascote PetVets">
        </div>
        <div class="form-box">
            <h2>Cadastro do Pet</h2>

            <form id="loginForm">
                <input type="text" id="animal" placeholder="Nome do Pet" required>
                <input type="number" id="idade" placeholder="Idade" required>
                <input type="text" id="especie" placeholder="Espécie" required>
                <input type="text" id="observacoes" placeholder="Observações do Pet" required>

                <p id="erroMsg" style="color: red; font-size: 14px; text-align: center; margin: 5px 0; height: 20px;"></p>

                <button type="submit">CADASTRAR</button>
            </form>
        </div>
    </div>

    <footer>
        © 2026 PetVets • Todos os direitos reservados.
    </footer>

    <script src="/js/cadastroPet.js"></script>
</body>
</html>
