<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/paginaEspecie.css"> 
<title>Cadastro Espécie - PetVets</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<header>
    <div class="logo">
        <img src="/img/mascoteNormal.png" alt="Mascote">
        PetVets
    </div>

    <a href="/index.html" class="btn-voltar">
        Voltar
    </a>
</header>

<div class="container">
    <div class="ilustracao">
        <img src="/img/mascoteEspecie.png" alt="Mascote PetVets">
    </div>
    <div class="form-box">

        <div class="conteudo-form">
            <div class="container-formulario">
                 <h2>Cadastre uma nova espécie</h2>
                 <form id="formEspecie">
                 <input type="text" id="nomeEspecie" required placeholder="Ex: Peixe">
      

                <button type="submit" id="btnCadastrar">
                    Salvar Espécie
                </button>

            </form>
        </div>
    </div>
</div>
</div>

<footer>
   © 2026 PetVets • Todos os direitos reservados.
</footer>

<script src="/js/paginaEspecie.js"></script> 
</body>
</html>
