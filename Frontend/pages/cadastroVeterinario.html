<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cadastroVeterinario.css"> 
    <title>Cadastro Veterinário - PetVets</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <img src="/img/mascoteNormal.png" alt="Mascote">
            PetVets
        </div>
        <a href="/index.html" class="btn-voltar">
            Voltar
        </a>
    </header>

    <div class="container">
        <div class="ilustracao">
            <img src="/img/mascoteVet.png" alt="Mascote PetVets">
        </div>
        <div class="form-box">
            <h2>Seja uma veterinária ou veterinário PetVets!</h2>
                <form id="loginForm">
            <input type="text" id="usuario" placeholder="Nome do Veterinário" required>
            
            <div class="linha">
                <input type="password" id="senha" placeholder="Senha" required>
            </div>

           <div class="linha">
                 <input type="text" id="CRMV" placeholder="CRMV" required>

           </div>
            <div class="linha">
                <input type="text" id="cpf" placeholder="CPF" required>
            </div>

            <div class="linha">
                <input type="text" id="telefone" placeholder="Telefone" required>
            </div>

            <button type="submit" id="btnCadastrar">
                Salvar Cadastro
            </button>

        </form>
                <!-- Tag adicionada para exibir a mensagem de erro do JS -->
                <p id="erroMsg" style="color: red; font-size: 14px; text-align: center; margin: 5px 0; height: 20px;"></p>
            </form>
        </div>
    </div>

    <footer>
        © 2026 PetVets • Todos os direitos reservados.
    </footer>

    <script src="../cadastroPet/cadastroPet.js"></script>
</body>
</html>
