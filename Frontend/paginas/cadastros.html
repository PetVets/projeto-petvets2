<!DOCTYPE html>
<html lang="pt-BR">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css"> 

<title>Cadastro de Tutor - PetVets</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

:root{
    --azul:#A9E7FF;
    --azul2:#DFF7FF;
    --azul3:#67C8F3;
    --texto:#4E4E4E;
}

body{
    background:#fff;
    color:var(--texto);
}

header{
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

header{
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.btn-voltar{
    text-decoration:none;
    background:var(--azul);
    color:#35515f;
    padding:12px 22px;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.btn-voltar:hover{
    background:var(--azul3);
    color:white;
    transform:translateY(-2px);
}

.logo{
    display:flex;
    align-items:center;
    gap:0;
    font-size:30px;
    font-weight:700;
    color:var(--azul3);
}

.logo img{
    width:65px;
    margin-right:-5px;
}

.container{
    width:100%;
    min-height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:70px;
    padding:50px 8%;
    flex-wrap:wrap;
}

.ilustracao{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    min-width:300px;
}

.ilustracao img{
    width:420px;
    max-width:100%;
}

.form-box{
    flex:1;
    max-width:650px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border:2px solid #eefbff;
}

.form-box h2{
    text-align:center;
    color:var(--azul3);
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:2px solid #dceef5;
    border-radius:12px;
    outline:none;
    transition:.3s;
    font-size:15px;
}

.input-group input:focus{
    border-color:var(--azul3);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:50px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

#btnCadastrar{
    background:var(--azul);
    color:#35515f;
}

#btnCadastrar:hover{
    background:var(--azul3);
    color:white;
}

#btnAnimal{
    background:#d8d8d8;
    color:#777;
    cursor:not-allowed;
}

#btnAnimal.ativo{
    background:var(--azul);
    color:#35515f;
    cursor:pointer;
}

#btnAnimal.ativo:hover{
    background:var(--azul3);
    color:white;
}

footer{
    padding:25px;
    text-align:center;
    color:#777;
    border-top:1px solid #eee;
    margin-top:30px;
}

@media(max-width:900px){

    .container{
        flex-direction:column;
        gap:30px;
    }

    .ilustracao img{
        width:250px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .form-box{
        width:100%;
        padding:30px;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        <img src="mascoteNormal.png" alt="Mascote">
        PetVets
    </div>

    <a href="index.html" class="btn-voltar">
        Voltar
    </a>

</header>

<div class="container">

    <div class="ilustracao">
        <img src="mascoteNoNot.webp" alt="Mascote PetVets">
    </div>

    <div class="form-box">

        <h2>Cadastro do Tutor</h2>

        <form id="formTutor">

            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="text" id="senha" required>
            </div>

            <button type="submit" id="btnCadastrar">
                Salvar Cadastro
            </button>

            <button type="button" id="btnAnimal" disabled>
                Cadastrar Animal
            </button>

        </form>

    </div>

</div>

<footer>

© 2026 PetVets • Todos os direitos reservados.

</footer>

<script>

const form = document.getElementById("formTutor");
const btnAnimal = document.getElementById("btnAnimal");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const cpf = document.getElementById("cpf").value.replace(/\D/g,"");
    const telefone = document.getElementById("telefone").value.trim();
    const email = document.getElementById("email").value.trim();
    const endereco = document.getElementById("endereco").value.trim();
    const cidade = document.getElementById("cidade").value.trim();
    const estado = document.getElementById("estado").value.trim();

    if(nome==="" || cpf==="" || telefone==="" || email==="" || endereco==="" || cidade==="" || estado===""){
        alert("Preencha todos os campos.");
        return;
    }

    if(cpf.length != 11){
        alert("CPF inválido.");
        return;
    }

    if(!email.includes("@") || !email.includes(".")){
        alert("E-mail inválido.");
        return;
    }

    alert("Tutor cadastrado com sucesso!");

    btnAnimal.disabled = false;
    btnAnimal.classList.add("ativo");

});

btnAnimal.addEventListener("click",function(){

    if(!btnAnimal.disabled){

        window.location.href = "cadastro-animal.html";

    }

});

</script>

</body>
</html>
